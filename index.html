<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-i18n-title="page.home.title" data-i18n-meta="page.home.meta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tshushko Moto — Off-road Motorcycle Travel</title>
  <meta name="description" content="Tshushko Moto — off-road motorcycle travel. Adventures from the YouTube channel with detailed routes, maps and GPX files.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff6a00'/%3E%3Ctext x='16' y='23' font-family='Arial Black, sans-serif' font-size='20' font-weight='900' fill='%230f1115' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="img/tshushko-moto-avatar.png" alt="" width="32" height="32">
      <span>TSHUSHKO <span class="accent">MOTO</span></span>
    </a>
    <div class="nav-right">
      <a class="nav-social" href="https://www.facebook.com/people/Tshushko-Moto/61575923775764/" target="_blank" rel="noopener" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a class="nav-social" href="https://www.youtube.com/@tshushkomoto" target="_blank" rel="noopener" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
      <div class="dropdown tm-lang">
        <a class="nav-link dropdown-toggle tm-lang-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Change language">
          <img class="tm-flag" src="img/flags/en.svg" alt="" id="tm-lang-flag">
          <span class="tm-lang-code" id="tm-lang-code">EN</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button type="button" class="dropdown-item tm-lang-item" data-lang="en"><img class="tm-flag" src="img/flags/en.svg" alt=""><span data-i18n="lang.en">English</span></button></li>
          <li><button type="button" class="dropdown-item tm-lang-item" data-lang="fr"><img class="tm-flag" src="img/flags/fr.svg" alt=""><span data-i18n="lang.fr">Français</span></button></li>
          <li><button type="button" class="dropdown-item tm-lang-item" data-lang="bg"><img class="tm-flag" src="img/flags/bg.svg" alt=""><span data-i18n="lang.bg">Български</span></button></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="container hero-grid">
    <div class="hero-text">
      <h1 class="hero-title" data-i18n="hero.title">Off-road motorcycle rides, with the route for every video</h1>
      <p class="hero-sub" data-i18n="hero.sub">Watch the ride on YouTube, then open its map and download the GPX to ride it yourself</p>
      <div class="hero-actions">
        <a href="https://www.youtube.com/@tshushkomoto?sub_confirmation=1" target="_blank" rel="noopener" class="btn btn-accent btn-lg">
          <i class="bi bi-youtube me-2"></i><span data-i18n="hero.subscribe">Subscribe on YouTube</span>
        </a>
        <a href="#adventures" class="btn btn-quiet btn-lg" data-i18n="hero.rides">See the rides</a>
      </div>
    </div>
    <a class="hero-latest" id="hero-latest" href="#adventures">
      <div class="hero-latest-photo"><img id="hero-latest-img" src="img/placeholder-thumb.svg" alt="" fetchpriority="high"></div>
      <div class="hero-latest-caption">
        <div class="hero-latest-text">
          <span class="hero-latest-label"><span class="waypoint" aria-hidden="true"></span><span data-i18n="hero.latest">Latest ride</span></span>
          <span class="hero-latest-title" id="hero-latest-title"></span>
        </div>
        <span class="hero-latest-meta" id="hero-latest-meta"></span>
      </div>
    </a>
  </div>
</section>

<section id="rides-map" class="container">
  <h2 class="section-title" data-i18n-html="home.map.title">Where I rode</h2>
  <figure class="ride-map">
    <div id="home-map" role="region" aria-label="Map"></div>
    <figcaption class="map-note"><span class="waypoint" aria-hidden="true"></span><span data-i18n="home.map.note">Each pin sits at the heart of its route. Click one to open the ride.</span></figcaption>
  </figure>
</section>

<section id="adventures" class="container">
  <h2 class="section-title" data-i18n-html="home.all.title">All adventures</h2>
  <div class="ride-log" id="video-grid"></div>
</section>

<footer>
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
    <div class="footer-brand">TSHUSHKO <span class="accent">MOTO</span></div>
    <div class="small footer-note">&copy; <span id="footer-year"></span> <span data-i18n="footer.note">Routes shared as GPX, ride them yourself</span></div>
    <div class="d-flex gap-3">
      <a class="footer-social" href="https://www.facebook.com/people/Tshushko-Moto/61575923775764/" target="_blank" rel="noopener" aria-label="Facebook">
        <i class="bi bi-facebook"></i>
      </a>
      <a class="footer-social" href="https://www.youtube.com/@tshushkomoto" target="_blank" rel="noopener" aria-label="YouTube">
        <i class="bi bi-youtube"></i>
      </a>
    </div>
  </div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="js/helpers.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/fr.js"></script>
<script src="js/i18n/bg.js"></script>
<script src="js/i18n.js"></script>
<script src="data/videos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
