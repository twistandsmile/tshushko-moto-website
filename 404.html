<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Tshushko Moto</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff6a00'/%3E%3Ctext x='16' y='23' font-family='Arial Black, sans-serif' font-size='20' font-weight='900' fill='%230f1115' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root { --tm-orange: #ff6a00; --tm-dark: #0f1115; --tm-muted: #9aa3af; --tm-text: #e8eaed; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tm-dark);
      color: var(--tm-text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .brand {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-weight: 500;
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      color: var(--tm-text);
      text-decoration: none;
    }
    .brand span { color: var(--tm-orange); }
    .code {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-weight: 500;
      font-size: clamp(6rem, 20vw, 10rem);
      line-height: 1;
      color: var(--tm-orange);
      margin: 0.25rem 0;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.75rem; }
    p { color: var(--tm-muted); max-width: 420px; margin: 0 auto 1.75rem; }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
      margin: 0 0.4rem;
    }
    .btn-accent { background: var(--tm-orange); color: #14100c; }
    .btn-accent:hover { background: #e65f00; }
    .btn-ghost { border: 1px solid #555c66; color: var(--tm-text); }
    .btn-ghost:hover { border-color: var(--tm-orange); color: var(--tm-orange); }
  </style>
</head>
<body>
  <div>
    <a class="brand" href="/index.html">TSHUSHKO <span>MOTO</span></a>
    <div class="code">404</div>
    <h1>Looks like you wandered off-route</h1>
    <p>This page doesn't exist. Head back to the adventures and keep riding.</p>
    <div>
      <a class="btn btn-accent" href="/index.html">Back to adventures</a>
      <a class="btn btn-ghost" href="https://www.youtube.com/@tshushkomoto" target="_blank" rel="noopener">YouTube</a>
    </div>
  </div>
  <script>
    // This page is self-contained, so it carries its own mini dictionary
    // (same resolution order as the rest of the site: ?lang=, localStorage,
    // browser language, English).
    (function () {
      var S = {
        en: { title: 'Page not found — Tshushko Moto', h1: 'Looks like you wandered off-route', p: 'This page doesn\u2019t exist. Head back to the adventures and keep riding.', back: 'Back to adventures' },
        fr: { title: 'Page introuvable — Tshushko Moto', h1: 'Il semble que vous soyez sorti de la route', p: 'Cette page n\u2019existe pas. Revenez aux aventures et continuez à rouler.', back: 'Retour aux aventures' },
        bg: { title: 'Страницата не е намерена — Tshushko Moto', h1: 'Изглежда, че сте се отклонили от маршрута', p: 'Тази страница не съществува. Назад към приключенията и да продължим.', back: 'Назад към приключенията' }
      };
      var lang = null;
      var param = new URLSearchParams(window.location.search).get('lang');
      if (param && S[param.toLowerCase().split('-')[0]]) lang = param.toLowerCase().split('-')[0];
      else {
        try { lang = window.localStorage.getItem('tm-lang'); } catch (e) {}
        if (!S[lang]) {
          var nav = (window.navigator.language || '').toLowerCase();
          lang = nav.indexOf('fr') === 0 ? 'fr' : nav.indexOf('bg') === 0 ? 'bg' : 'en';
        }
      }
      var s = S[lang];
      document.documentElement.setAttribute('lang', lang);
      document.title = s.title;
      document.querySelector('h1').textContent = s.h1;
      document.querySelector('p').textContent = s.p;
      var a = document.querySelector('a.btn-accent');
      if (a) a.textContent = s.back;
    })();
  </script>
</body>
</html>
